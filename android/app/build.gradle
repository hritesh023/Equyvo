apply plugin: 'com.android.application'

// Force Java 17 for all subprojects
subprojects {
    afterEvaluate {
        if (project.hasProperty('android')) {
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            
            tasks.withType(JavaCompile) {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }
}

android {
    namespace = "com.equyvo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    tasks.withType(JavaCompile) {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "equyvo.acronous.com"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Google Play requires every uploaded bundle to have a versionCode
        // strictly higher than the highest versionCode already used in ANY
        // track (internal/closed/open/production). Reusing one makes Play
        // report "This release does not add or remove any app bundles" and
        // blocks the rollout because existing users have no upgrade path.
        // Strictly higher than every versionCode already uploaded to any
        // Play track (internal/closed/open/production).
        versionCode 213
        versionName "1.3.87"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    androidResources {
        // Ship only English resources: the ad/UMP libraries bundle dozens of
        // locales the app never renders (app i18n lives in the web layer).
        // Cuts APK/AAB size and memory footprint (Play Console size score).
        localeFilters += ['en']
    }
    
    // Signing credentials are read from android/local.properties (gitignored)
    // so the upload key password is never committed to source control.
    def signingProps = new Properties()
    def signingPropsFile = rootProject.file('local.properties')
    if (signingPropsFile.exists()) {
        signingProps.load(new FileInputStream(signingPropsFile))
    }

    signingConfigs {
        release {
            def store = signingProps.getProperty('MYAPP_UPLOAD_STORE_FILE')
            if (store) {
                storeFile file(store)
                storePassword signingProps.getProperty('MYAPP_UPLOAD_STORE_PASSWORD')
                keyAlias signingProps.getProperty('MYAPP_UPLOAD_KEY_ALIAS')
                keyPassword signingProps.getProperty('MYAPP_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    
    buildTypes {
        release {
            // Full R8: dead-code elimination + optimization + obfuscation.
            // Play Console previously reported "Obfuscation percentage 1%"
            // because minification was disabled entirely.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
