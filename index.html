<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Equyvo</title>
  <script>
    // Native-shell marker: inside the Android/iOS app Capacitor handles the
    // status-bar / gesture-bar insets natively (MainActivity), so the web
    // layer must NOT add its own safe-area padding on top (no double gaps).
    // The desktop/phone-browser site keeps env()-based safe-area padding.
    try {
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
        document.documentElement.classList.add('cap-native');
      }
    } catch (e) { /* browser — ignore */ }
  </script>
  <link rel="icon" type="image/png" href="/Equyvo_logo.png" />
  <link rel="apple-touch-icon" href="/Equyvo_logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://googleads.g.doubleclick.net" />
  <link rel="preconnect" href="https://pagead2.googlesyndication.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
</head>

<body style="background-color: #0a0a0a; margin: 0; padding: 0;">
  <div id="root">
  </div>
  <script>
    // Production-safe global error hooks: log for diagnostics only.
    // Never render error internals into the UI (no debug overlays).
    window.onerror = function (message, source, lineno, colno, error) {
      try {
        console.error('Global Error:', message, 'At:', source + ':' + lineno + ':' + colno, error);
      } catch { /* ignore */ }
    };
    window.addEventListener('unhandledrejection', function (event) {
      try {
        console.error('Unhandled Rejection:', event.reason);
      } catch { /* ignore */ }
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Enable mobile/tablet keyboard suggestions (predictive text) for every
    // text input/textarea. Android WebView disables the suggestion strip when
    // spellcheck/autocorrect are off; force them on for text fields so the
    // default keyboard behaves like other apps. Password/email fields keep
    // their own sensible settings.
    (function () {
      function fix(el) {
        if (!el || !el.tagName) return;
        var t = el.tagName.toLowerCase();
        if (t !== 'input' && t !== 'textarea') return;
        var type = (el.getAttribute('type') || 'text').toLowerCase();
        if (type === 'password' || type === 'email' || type === 'tel' || type === 'number' || type === 'url') return;
        if (el.getAttribute('spellcheck') !== 'false') el.setAttribute('spellcheck', 'true');
        if (!el.getAttribute('autocorrect')) el.setAttribute('autocorrect', 'on');
        if (!el.getAttribute('autocomplete') || el.getAttribute('autocomplete') === 'off') el.setAttribute('autocomplete', 'on');
      }
      function scan(root) {
        if (!root) return;
        if (root.querySelectorAll) root.querySelectorAll('input,textarea').forEach(fix);
        if (root.tagName) fix(root);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { scan(document); });
      } else {
        scan(document);
      }
      var obs = new MutationObserver(function (muts) {
        muts.forEach(function (m) {
          m.addedNodes && m.addedNodes.forEach(function (n) { scan(n); });
        });
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
</body>

</html>
